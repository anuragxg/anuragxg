<text x="44" y="116" font-size="13" fill="#6b7a99" font-family="'Courier New', Courier, monospace" letter-spacing="3">REAL-TIME . 3D . AI FALLBACK</text>
<text x="44" y="138" font-size="15" fill="#c9d6ee" font-family="'Courier New', Courier, monospace">A real-time 3D chatbot companion. React Three Fiber character with a full</text><text x="44" y="162" font-size="15" fill="#c9d6ee" font-family="'Courier New', Courier, monospace">idle/gesture animation system (GSAP), live chat over Socket.IO, and a three-</text><text x="44" y="186" font-size="15" fill="#c9d6ee" font-family="'Courier New', Courier, monospace">tier AI fallback: local Ollama &gt; Gemini API &gt; graceful degradation, so it</text><text x="44" y="210" font-size="15" fill="#c9d6ee" font-family="'Courier New', Courier, monospace">works both offline and deployed.</text>
<g transform="translate(44,238)"><rect width="69" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="34" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">React</text></g><g transform="translate(123.0,238)"><rect width="95" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="47" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">Three.js</text></g><g transform="translate(227.8,238)"><rect width="86" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="43" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">Node.js</text></g><g transform="translate(324.0,238)"><rect width="86" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="43" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">Express</text></g><g transform="translate(420.2,238)"><rect width="103" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="52" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">Socket.IO</text></g><g transform="translate(533.6,238)"><rect width="86" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="43" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">MongoDB</text></g><g transform="translate(629.8,238)"><rect width="60" height="30" rx="15" fill="#00f5ff" fill-opacity="0.12" stroke="#00f5ff" stroke-opacity="0.8"/><text x="30" y="20" font-size="13" fill="#e6f1ff" font-family="'Courier New', Courier, monospace" text-anchor="middle">GSAP</text></g>
