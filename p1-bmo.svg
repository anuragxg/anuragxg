<text x="956" y="46" font-size="13" fill="#7b2ff7" font-family="'Courier New', Courier, monospace" letter-spacing="3" text-anchor="end">&gt; REPO ONLINE<animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></text>
